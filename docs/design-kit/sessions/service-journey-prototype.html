<html lang="en">
<head>

<title>Serbizyu · Service listing and partner options</title>
<link rel="stylesheet" href="final-kit.css"><link rel="stylesheet" href="service-journey-prototype.css">
<style>
.listing-layout{grid-template-columns:minmax(0,7fr) minmax(320px,5fr)}.listing-main{display:grid;gap:22px;min-width:0}.listing-photo{padding:0;position:relative;background:var(--muted);border-radius:16px;overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center}.listing-photo img{height:100%;width:100%;object-fit:cover}.listing-photo .photo-button{position:absolute;right:12px;bottom:12px;background:white;border:1px solid var(--border);min-height:44px;border-radius:10px;padding:9px 13px;color:var(--primary);font-weight:700}.listing-identity{display:grid;gap:15px}.listing-identity h1{font-size:27px;line-height:1.25}.listing-price{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.listing-price del{color:var(--muted-foreground);font-size:14px}.listing-rating{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}.listing-rating button{border:0;background:none;color:var(--primary);padding:8px 0;min-height:44px;text-decoration:underline;text-underline-offset:3px}.stars{display:inline-flex;align-items:center;gap:3px;color:var(--waiting);font-weight:800}.stars .ic{fill:var(--mango);stroke:var(--waiting);width:17px;height:17px}.provider-box{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding-top:16px}.provider-box>div{flex:1}.provider-box p{font-size:13px;color:var(--muted-foreground)}.package-rail{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}.package-option{min-width:190px;flex:0 0 190px;scroll-snap-align:start;padding:14px;text-align:left;border:1px solid var(--border-strong);border-radius:12px;background:white;display:grid;gap:8px;color:var(--foreground)}.package-option[aria-pressed=true]{border-color:var(--primary);outline:1px solid var(--primary);background:var(--accent)}.package-option strong{font-size:14px}.package-option .money{font-size:19px}.package-option small{font-size:12px;color:var(--muted-foreground)}.included-list{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:9px}.included-list li{display:flex;gap:9px;font-size:14px}.included-list .ic{color:var(--done);flex-shrink:0;margin-top:2px}.section-part{padding-top:18px;margin-top:18px;border-top:1px solid var(--border)}.addon-choice{display:flex;align-items:start;gap:10px;padding:13px 0;font-size:14px;cursor:pointer}.addon-choice input{width:18px;height:18px;margin:3px 0 0}.addon-choice>span{flex:1}.addon-choice small{display:block;color:var(--muted-foreground);font-size:12px;margin-top:3px}.quantity-control{display:flex;align-items:center;justify-content:space-between;gap:12px}.quantity-buttons{display:flex;align-items:center;gap:12px}.quantity-buttons button{width:44px;height:44px;background:white;border:1px solid var(--border-strong);border-radius:9px;font-weight:700}.quantity-buttons output{font-weight:800;min-width:20px;text-align:center}.partner-choice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:15px 0;align-items:center;border-top:1px solid var(--border)}.partner-choice:first-child{border-top:0}.partner-choice input{width:19px;height:19px}.partner-choice label strong{font-size:15px;display:block}.partner-choice label small{display:block;color:var(--muted-foreground);font-size:12px;margin-top:4px}.partner-choice .text-link{min-height:44px;font-size:13px}.text-link{border:0;background:none;color:var(--primary);font-weight:700;min-height:44px;padding:8px 0;text-decoration:underline;text-underline-offset:3px}.listing-about{font-size:15px;line-height:1.65;color:var(--ink-soft)}.summary-lines{display:grid;gap:12px}.summary-line{display:flex;justify-content:space-between;gap:14px;font-size:14px}.summary-line span{color:var(--muted-foreground)}.summary-line.total{border-top:1px solid var(--border);padding-top:14px;font-size:17px}.summary-line strong{text-align:right}.review-filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.review-filters button{min-height:44px;padding:8px 13px;border:1px solid var(--border);background:white;border-radius:999px;color:var(--primary);font-size:13px;font-weight:700}.review-filters button[aria-pressed=true]{background:var(--primary);color:white;border-color:var(--primary)}.preview-controls{margin-bottom:20px;font-size:13px;color:var(--muted-foreground)}.preview-controls>summary{min-height:44px;cursor:pointer;display:flex;align-items:center}.preview-controls .pv-toolbar{margin-bottom:0}.preview-controls select{font-size:13px}.work-step{padding:12px 0;border-bottom:1px solid var(--border)}.work-step:last-child{border:0}.work-step strong{display:block;font-size:14px}.work-step p{font-size:13px;color:var(--muted-foreground);margin-top:5px}.partner-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}.partner-row img{width:44px;height:44px;object-fit:cover;border-radius:9px}.partner-row>div{flex:1}.partner-row small{display:block;color:var(--muted-foreground);font-size:12px;margin-top:4px}.partner-row strong{font-size:14px}.lab-replies{margin-top:20px;border-top:1px solid var(--border);padding-top:10px;color:var(--muted-foreground);font-size:13px}.lab-replies summary{min-height:44px;cursor:pointer}.lab-replies .participant{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0}.dock-picks{flex:0 0 44px!important;width:44px;min-height:44px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;background:white;color:var(--primary)}.selection-notice{font-size:14px;color:var(--done);min-height:0}.selection-notice:empty{display:none}.picks-badge{min-height:44px;border:0;background:white;color:var(--primary);font-weight:700}.listing-side .pv-section{padding:24px}.listing-side .btn{width:100%}.listing-side .pv-desktop-action{display:grid;gap:10px}.review-heading{margin-bottom:24px}.review-heading h1{margin:10px 0}.pv-dialog img{max-width:100%}.preview-state{margin-top:20px;color:var(--muted-foreground);font-size:12px}.preview-state summary{min-height:44px;cursor:pointer}.pv-dock .dock-review{flex:1}.pv-dock .btn::before{display:none}
@media(max-width:799px){.listing-layout{grid-template-columns:minmax(0,1fr)}.listing-photo{height:auto;aspect-ratio:16/10}.listing-identity h1{font-size:24px}.listing-side{position:static}.package-option{flex-basis:180px;min-width:180px}.partner-choice{grid-template-columns:auto minmax(0,1fr)}.partner-choice>.text-link{grid-column:2;justify-self:start}.provider-box{flex-wrap:wrap}.provider-box .btn{margin-left:auto}.pv-dock{gap:10px}.pv-dock .money{font-size:17px}.pv-dock .pv-meta{font-size:11px}.listing-side .pv-section{padding:18px}}
@media(max-width:799px){.picks-badge{order:1;margin-left:auto}.pv-nav{order:2}}
.listing-photo .save-listing{top:12px;bottom:auto}
.customer-reviews{display:grid;gap:16px}.customer-reviews-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding-bottom:14px}.customer-reviews-head h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em}.customer-reviews-head span{font-size:12px;color:var(--muted-foreground)}.job-photo-caption{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted-foreground);margin-bottom:9px}.job-photo-rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.job-photo-rail button{width:80px;height:80px;flex:0 0 80px;border:1px solid var(--border);border-radius:12px;overflow:hidden;padding:0;background:white}.job-photo-rail img{width:100%;height:100%;object-fit:cover}.customer-review-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:#fafcfb;display:grid;gap:10px}.customer-review-card.compact{padding:12px;background:white}.customer-review-card-head{display:flex;align-items:start;justify-content:space-between;gap:12px;font-size:13px}.customer-review-card-head strong{min-width:0}.customer-review-card-head small{color:var(--muted-foreground);font-size:11px;white-space:nowrap}.customer-review-rating{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.customer-review-rating .stars{gap:2px}.customer-review-rating .ic{width:14px;height:14px}.review-package{padding:3px 7px;border-radius:6px;background:var(--accent);color:var(--primary);font-size:11px;font-weight:700}.customer-review-card p{font-size:14px;line-height:1.6}.more-review-toggle{justify-self:center;min-height:44px}.customer-reviews .review-filters{margin:0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.customer-reviews .review-filters button{flex-shrink:0}.expanded-reviews{border-top:1px solid var(--border);padding-top:16px;display:grid;gap:12px}.reviews-empty{border:1px dashed var(--border-strong);border-radius:12px;padding:24px;text-align:center;color:var(--muted-foreground);font-size:14px}
</style>
</head>
<body>
<!-- Consumer mock only: preserve the live listing's composition; do not modify its builder. -->
<header class="pv-header"><div class="pv-header-inner"><a class="pv-brand" href="service-journey-prototype.html"><img src="../assets/brand/serbizyu-long-navy-opt.png" alt="Serbizyu"></a><nav class="pv-nav" aria-label="Prototype screens"><a href="service-journey-prototype.html" aria-current="page">Service</a><a href="service-orders-prototype.html?offer=cool-again&view=group">Orders</a><a href="quick-deal-journey-prototype.html">Quick Deal</a></nav><button class="picks-badge" id="picksButton" onclick="openPicks()">Picks (0)</button></div></header>
<p class="pv-prototype-note">Interactive preview · sample listing, photos and reviews · no real transactions</p>
<main class="pv-page" id="page"></main><footer class="pv-dock" id="dock"></footer>
<dialog class="pv-dialog" id="sheet" aria-labelledby="sheet-title"><svg class="pv-wave" viewBox="0 0 390 34" preserveAspectRatio="none" aria-hidden="true"><path d="M 0 16 C 90 2, 140 0, 195 0 C 255 0, 315 8, 390 28 L 390 34 L 0 34 Z" fill="white"/></svg><div class="pv-sheet-body"><div class="pv-sheet-head"><h2 id="sheet-title"></h2><button class="pv-sheet-close" aria-label="Close" onclick="closeSheet()"><svg class="ic" aria-hidden="true"><use href="final-icons.svg#i-x"/></svg></button></div><div class="stack" id="sheet-content"></div></div></dialog>
<script>
const $=id=>document.getElementById(id);
const icon=name=>name==='star'?'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.67 6.26.91-4.53 4.42 1.07 6.24L12 17.3l-5.6 2.94 1.07-6.24L2.94 9.58l6.26-.91L12 3Z"/></svg>':`<svg class="ic" aria-hidden="true"><use href="final-icons.svg#i-${name}"/></svg>`;
const money=n=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(n);
const packages=[
 {id:'standard',title:'1 Unit Standard',price:450,old:550,sub:'Deep coil & drain clean',inclusions:['On-site breaker isolation & diagnostic status check','Evaporator coil alkaline chemical foam disinfection','Blower fan wheel disassembly and grease flush','Dual-probe delta temperature test (ΔT ≥ 12°C)']},
 {id:'duo',title:'2 Units Dual Split',price:850,old:1100,sub:'Save ₱50 bundle',inclusions:['Complete service on two indoor units','Outdoor condensing unit pressure flush & fin inspection','Freon operating pressure calibration test','Full photographic milestone sign-off']},
 {id:'home',title:'3 Units Full Home',price:1200,old:1650,sub:'Save ₱150 package',inclusions:['Complete service on three indoor units + outdoor units','Anti-bacterial ozone air duct sanitization','Priority same-day completion guarantee','Customer OTP handover & digital service warranty']}
];
const addons=[{id:'rush',title:'Rush priority scheduling',price:100,description:'Priority requested; time still confirmed by the provider.'},{id:'flush',title:'Anti-bacterial chemical flush',price:150,description:'Additional diagnostic and cleaning scope.'}];
const reviews=[{id:1,author:'Maria S.',area:'Poblacion Este',stars:5,package:'1 Unit Standard',text:'Dumating sa oras. Malinis ang gawa at malamig na ulit.',photo:true},{id:2,author:'Ramon D.',area:'Poblacion Centro',stars:5,package:'2 Units Dual Split',text:'Maayos kausap. Both units were checked before leaving.'},{id:3,author:'Liza B.',area:'Bitalag',stars:4,package:'1 Unit Standard',text:'Good cleaning. The visit time was confirmed before arrival.'},{id:4,author:'Joel M.',area:'Poblacion Este',stars:5,package:'3 Units Full Home',text:'Malinis ang trabaho. Explained what needed checking.'}];
const state={scenario:'partnership',view:'listing',offer:'service',packageId:'standard',addons:[],quantity:1,reviewFilter:'all',reviewsExpanded:false,sent:false,accepted:[],quote:false,picks:[],saved:false,notice:''};
const pkg=()=>packages.find(p=>p.id===state.packageId);
const selectedAddons=()=>addons.filter(a=>state.addons.includes(a.id));
const unitPrice=()=>pkg().price+selectedAddons().reduce((sum,a)=>sum+a.price,0);
const isBundle=()=>state.offer==='cool-again';
const unpriced=()=>isBundle()&&state.scenario==='quote'&&!state.quote;
function agreements(){const q=state.quantity,service={key:'service',title:'Inverter Split AC Deep Clean & Checkup',provider:'Kuya Ben Aircon Services',price:unitPrice()*q,photo:'../photos/ac-clean.jpg',scope:`${pkg().title} × ${q}${selectedAddons().length?' · '+selectedAddons().map(a=>a.title).join(', '):''}`};return isBundle()?[{key:'parts',title:'35µF replacement capacitor',provider:'Tagudin Hardware',price:180*q,photo:'../photos/ac-capacitor.jpg',scope:`${q} part${q===1?'':'s'}`},{key:'delivery',title:'Parts delivery',provider:'Danny Express',price:unpriced()?null:35*q,photo:'../photos/courier.jpg',scope:`${q} delivery request${q===1?'':'s'} · after part handoff`},service]:[service];}
function knownTotal(){return agreements().reduce((sum,a)=>sum+(a.price??0),0);}
function totalText(){return money(knownTotal())+(unpriced()?' + delivery quote':'');}
function openSheet(title,content){$('sheet-title').textContent=title;$('sheet-content').innerHTML=content;if(!$('sheet').open)$('sheet').showModal();}
function closeSheet(){if($('sheet').open)$('sheet').close();}
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet();});
function clearReplies(){state.sent=false;state.accepted=[];state.notice='';}
function selectPackage(id){state.packageId=id;state.quantity=1;clearReplies();render();}
function toggleAddon(id){state.addons=state.addons.includes(id)?state.addons.filter(a=>a!==id):[...state.addons,id];clearReplies();render();}
function changeQuantity(delta){state.quantity=Math.max(1,Math.min(10,state.quantity+delta));clearReplies();render();}
function chooseOffer(offer){state.offer=offer;clearReplies();render();}
function changeScenario(value){Object.assign(state,{scenario:value,offer:'service',quote:false,sent:false,accepted:[],notice:''});render();}
function quantityControl(){return `<div class="quantity-control"><strong>Quantity</strong><div class="quantity-buttons"><button aria-label="Decrease quantity" ${state.quantity===1?'disabled':''} onclick="changeQuantity(-1)">−</button><output aria-label="Quantity">${state.quantity}</output><button aria-label="Increase quantity" ${state.quantity===10?'disabled':''} onclick="changeQuantity(1)">+</button></div></div>`;}
function ratingLink(){return state.scenario==='new'?'<span class="stars">'+icon('star')+'New</span><button onclick="document.getElementById(\'reviews\').scrollIntoView()">0 reviews</button>':`<span class="stars">${icon('star')}4.8</span><button onclick="document.getElementById('reviews').scrollIntoView()">4 reviews</button>`;}
function provider(){return `<div class="provider-box"><span class="avatar">KB</span><div><strong>Kuya Ben Aircon Services</strong><p>Tagudin · service provider</p></div><button class="btn" onclick="providerDetails()">${icon('chat')}Chat</button></div>`;}
function providerDetails(){openSheet('Kuya Ben Aircon Services','<p>Service area: Tagudin.</p><p>Sample conversation view. No message is sent by this preview.</p><label>Your message<textarea placeholder="Ask about the service" disabled></textarea></label><p class="hint">Use the real listing’s conversation for actual messages.</p>');}
function showPhoto(){openSheet('Service photo','<img src="../photos/ac-clean.jpg" alt="Sample aircon service photo"><p class="hint">Sample media for this mock.</p>');}
function workDetails(){openSheet('How the service works',`<div>${[['Breaker isolation & coil status triage','Breaker lockout photo.'],['Chemical foam wash & pressure rinse','Foam coverage photo.'],['Cold compressor run & amp verification','Record the compressor amperage reading (A).'],['Delta temperature drop test (ΔT ≥ 12°C)','Photo and temperature reading, with customer OTP sign-off.']].map(([title,text])=>`<div class="work-step"><strong>${title}</strong><p>${text}</p></div>`).join('')}</div><p class="hint">Work confirmation and payment stay separate.</p>`);}
function partnerDetails(){const selected=isBundle();openSheet('Service with parts & delivery',`<p class="hint">Saved offer: Cool Again · offered by Kuya Ben.</p>${partnerRows(true)}<p class="hint">Part handoff → delivery → service. Pay each provider for their own order.</p><button class="btn primary" id="choosePartner">${selected?'Keep this option':'Choose this option'}</button>`);$('choosePartner').onclick=()=>{closeSheet();chooseOffer('cool-again');};}
function partnerRows(details=false){return agreementsForDetails().map(a=>`<div class="partner-row"><img src="${a.photo}" alt=""><div><strong>${a.title}</strong><small>${a.provider}${details?' · '+a.scope:''}</small></div><strong class="money">${a.price===null?'Quote required':money(a.price)}</strong></div>`).join('');}
function agreementsForDetails(){if(isBundle())return agreements();const previous=state.offer;state.offer='cool-again';const result=agreements();state.offer=previous;return result;}
function review(){state.view='review';state.notice='';render();window.scrollTo(0,0);}
function backToListing(){state.view='listing';render();window.scrollTo(0,0);}
function snapshotChoice(){return {packageId:state.packageId,addons:[...state.addons],quantity:state.quantity,offer:state.offer,scenario:state.scenario,quote:state.quote};}
function addToPicks(){const choice=snapshotChoice(),pendingQuote=choice.offer==='cool-again'&&choice.scenario==='quote'&&!choice.quote,key=JSON.stringify([choice.packageId,choice.addons.slice().sort(),choice.offer,pendingQuote]);const found=state.picks.find(p=>p.key===key&&p.choice.quantity+choice.quantity<=10);if(found)found.choice.quantity+=choice.quantity;else state.picks.push({key,choice});state.notice='Added to Picks';render();}
function pickTotal(choice){const p=packages.find(p=>p.id===choice.packageId),extra=addons.filter(a=>choice.addons.includes(a.id)).reduce((sum,a)=>sum+a.price,0);return (p.price+extra+(choice.offer==='cool-again'?215:0))*choice.quantity;}
function openPicks(){openSheet('Your Picks',state.picks.length?state.picks.map((p,index)=>`<div class="partner-row"><div><strong>${packages.find(x=>x.id===p.choice.packageId).title} × ${p.choice.quantity}</strong><small>${p.choice.offer==='cool-again'?'With parts & delivery':'Service only'}${p.choice.addons.length?' · '+p.choice.addons.map(id=>addons.find(a=>a.id===id).title).join(', '):''}</small><button class="text-link" onclick="reviewPick(${index})">Review this request</button></div><strong>${p.choice.scenario==='quote'&&!p.choice.quote&&p.choice.offer==='cool-again'?'Quote required':money(pickTotal(p.choice))}</strong><button class="btn" aria-label="Remove pick ${index+1}" onclick="state.picks.splice(${index},1);render();openPicks()">Remove</button></div>`).join('')+'<p class="hint">Choose one request to review. Other Picks stay here.</p>':'<p>No Picks yet.</p>');}
function reviewPick(index){const choice=state.picks[index].choice;Object.assign(state,{packageId:choice.packageId,addons:[...choice.addons],quantity:choice.quantity,offer:choice.offer,scenario:choice.scenario,quote:choice.quote,sent:false,accepted:[]});closeSheet();review();}
function customerReviewCard(review,compact=false){
 const age={1:'2 days ago',2:'1 week ago',3:'2 weeks ago',4:'1 month ago'}[review.id];
 return `<article class="customer-review-card ${compact?'compact':''}" aria-label="Sample review by ${review.author}"><div class="customer-review-card-head"><strong>${review.author} · ${review.area}</strong><small>${age}</small></div><div class="customer-review-rating"><span class="stars" aria-label="${review.stars} out of 5 stars">${Array.from({length:review.stars},()=>icon('star')).join('')}</span><span class="review-package">${review.package}</span></div><p>“${review.text}”</p></article>`;
}
function toggleReviews(){state.reviewsExpanded=!state.reviewsExpanded;if(!state.reviewsExpanded)state.reviewFilter='all';render();document.querySelector('#reviews .more-review-toggle').focus({preventScroll:true});}
function filterReviews(filter){state.reviewFilter=filter;render();document.querySelector('#reviews .review-filters [aria-pressed="true"]').focus({preventScroll:true});}
function reviewsSection(){
 const empty=state.scenario==='new';
 const filtered=reviews.filter(r=>state.reviewFilter==='all'||state.reviewFilter==='photos'&&r.photo||String(r.stars)===state.reviewFilter);
 const featured=state.reviewsExpanded?filtered[0]:reviews[0];
 return `<section class="pv-section customer-reviews" id="reviews"><div class="customer-reviews-head"><h2>Customer reviews</h2><span>${empty?'No reviews yet':'4 sample local reviews'}</span></div>${empty?'<div class="reviews-empty"><strong>No customer reviews yet</strong><p>Reviews and work photos appear here when available.</p></div>':`<div><p class="job-photo-caption">${icon('camera')}Job photo samples (1)</p><div class="job-photo-rail"><button aria-label="View sample job photo" onclick="showPhoto()"><img src="../photos/ac-clean.jpg" alt="Sample AC cleaning work photo"></button></div></div>${featured?customerReviewCard(featured):'<p class="pv-empty">No reviews match this filter.</p>'}<button class="text-link more-review-toggle" onclick="toggleReviews()">${state.reviewsExpanded?'Hide reviews':'+ View more reviews (3 more)'}</button>${state.reviewsExpanded?`<div class="expanded-reviews"><div class="review-filters">${[['all','All (4)'],['5','5 stars (3)'],['4','4 stars (1)'],['photos','With photos (1)']].map(([id,label])=>`<button aria-pressed="${state.reviewFilter===id}" onclick="filterReviews('${id}')">${label}</button>`).join('')}</div>${filtered.slice(1).map(r=>customerReviewCard(r,true)).join('')}</div>`:''}`}</section>`;
}
function summary(){return `<section class="pv-section stack"><p class="pv-meta">Selected: ${pkg().title} × ${state.quantity}</p><h2>${isBundle()?'Service + partners':'Your service'}</h2><div class="summary-lines"><div class="summary-line"><span>Service package</span><strong>${money(pkg().price*state.quantity)}</strong></div>${selectedAddons().map(a=>`<div class="summary-line"><span>${a.title}</span><strong>${money(a.price*state.quantity)}</strong></div>`).join('')}${isBundle()?`<div class="summary-line"><span>Replacement part</span><strong>${money(180*state.quantity)}</strong></div><div class="summary-line"><span>Delivery</span><strong>${unpriced()?'Quote required':money(35*state.quantity)}</strong></div>`:''}<div class="summary-line total"><span>${isBundle()?'Separate-order total':'Total'}</span><strong class="money">${totalText()}</strong></div></div><p class="hint">${isBundle()?'Pay each provider separately.':'Time confirmed with the provider.'}</p><div class="pv-desktop-action"><button class="btn primary" onclick="review()">Review request</button><button class="btn" onclick="addToPicks()">Add to Picks</button></div><p class="selection-notice" role="status">${state.notice}</p></section>`;}
function listing(){return `<details class="preview-controls"><summary>Preview cases</summary><div class="pv-toolbar"><label>Listing example<select id="scenario" onchange="changeScenario(this.value)"><option value="partnership" ${state.scenario==='partnership'?'selected':''}>With partner option & sample reviews</option><option value="none" ${state.scenario==='none'?'selected':''}>Service only</option><option value="quote" ${state.scenario==='quote'?'selected':''}>Delivery quote pending</option><option value="new" ${state.scenario==='new'?'selected':''}>No image / no reviews</option></select></label></div></details><div class="pv-breadcrumb">Services / Repairs / Aircon care</div><div class="pv-layout listing-layout"><div class="listing-main"><div class="listing-photo">${state.scenario==='new'?'<span class="pv-meta">No listing image</span>':'<img src="../photos/ac-clean.jpg" alt="Sample aircon service"><button class="photo-button" onclick="showPhoto()">View photo</button>'}</div><section class="pv-section listing-identity"><h1>Inverter Split AC Deep Clean & Checkup</h1><div class="listing-price"><strong class="pv-price">${money(unitPrice())}</strong>${!state.addons.length?`<del>${money(pkg().old)}</del>`:''}<span class="pv-meta">/ service package</span></div><div class="listing-rating">${ratingLink()}</div><p class="listing-about">Complete chemical wash of indoor evaporator coil, blower fan wheel removal, drain line unblocking, and operating freon pressure checkup.</p>${provider()}</section><section class="pv-section"><div class="split"><h2>Choose service package</h2><span class="pv-meta">3 options</span></div><div class="package-rail" style="margin-top:15px">${packages.map(p=>`<button class="package-option" aria-pressed="${state.packageId===p.id}" onclick="selectPackage('${p.id}')"><strong>${p.title}</strong><span class="money">${money(p.price)}</span><small>${p.sub}</small></button>`).join('')}</div><h3>Included in ${pkg().title}</h3><ul class="included-list">${pkg().inclusions.map(i=>`<li>${icon('check')}<span>${i}</span></li>`).join('')}</ul><div class="section-part"><h3>Seller add-ons</h3>${addons.map(a=>`<label class="addon-choice"><input type="checkbox" ${state.addons.includes(a.id)?'checked':''} onchange="toggleAddon('${a.id}')"><span><strong>${a.title}</strong><small>${a.description}</small></span><strong class="money">+${money(a.price)}</strong></label>`).join('')}</div><div class="section-part">${quantityControl()}</div><button class="text-link" onclick="workDetails()">How the service works</button></section><section class="pv-section"><h2>Partner options</h2><div class="partner-choice"><input type="radio" id="service-only" name="offer" ${!isBundle()?'checked':''} onchange="chooseOffer('service')"><label for="service-only"><strong>Service only</strong><small>Your selected package and add-ons</small></label></div>${state.scenario!=='none'?`<div class="partner-choice"><input type="radio" id="partnership" name="offer" ${isBundle()?'checked':''} onchange="chooseOffer('cool-again')"><label for="partnership"><strong>With parts & delivery</strong><small>Cool Again · offered by Kuya Ben</small><span class="money">${state.scenario==='quote'&&!state.quote?'Part '+money(180)+' + delivery quote':'+'+money(215)} / request</span></label><button class="text-link" onclick="partnerDetails()">Details</button></div>`:'<p class="pv-empty">No partner option on this listing.</p>'}<button class="text-link" onclick="addToPicks()">Add selection to Picks</button><p class="selection-notice" role="status">${state.notice}</p></section>${reviewsSection()}</div><aside class="pv-side listing-side">${summary()}</aside></div>`;}
function orderURL(){const params=new URLSearchParams({offer:state.offer,view:isBundle()?'group':'detail',package:state.packageId,quantity:String(state.quantity)});if(state.addons.length)params.set('addons',state.addons.join(','));return 'service-orders-prototype.html?'+params.toString();}
function reviewAction(){if(state.sent&&state.accepted.length===agreements().length)return `<a class="btn primary block" href="${orderURL()}">View Orders</a>`;if(state.sent)return '<button class="btn primary block" disabled>Waiting for providers</button>';return `<button class="btn primary block" ${unpriced()?'disabled':''} onclick="sendRequest()">Send request</button>`;}
function reviewView(){const rows=agreements();return `<div class="review-heading"><button class="text-link" onclick="backToListing()">Back to listing</button><h1>${state.sent?'Provider replies':'Review your request'}</h1><p class="pv-muted">${isBundle()?'Each provider confirms their part.':'Kuya Ben confirms the request.'}</p></div><div class="pv-layout"><section class="pv-section"><h2>${isBundle()?'Service with parts & delivery':pkg().title}</h2>${rows.map(a=>`<div class="partner-row"><img src="${a.photo}" alt=""><div><strong>${a.title}</strong><small>${a.provider}</small><small>${a.scope}</small></div><div style="text-align:right"><strong class="money">${a.price===null?'Quote required':money(a.price)}</strong>${state.sent?`<small>${state.accepted.includes(a.key)?'Accepted':'Awaiting reply'}</small>`:''}</div></div>`).join('')}<details class="section-part"><summary style="min-height:44px;cursor:pointer">Request details</summary><p class="hint">Maria Santos · Poblacion Este, Tagudin. Time to be confirmed. ${pkg().inclusions.join('; ')}.</p></details>${state.sent?`<details class="lab-replies"><summary>Preview provider replies</summary><p class="hint">These buttons simulate separate provider sessions.</p>${rows.map(a=>`<div class="participant"><strong>${a.provider}</strong><button class="btn" ${state.accepted.includes(a.key)?'disabled':''} onclick="accept('${a.key}')">${state.accepted.includes(a.key)?'Accepted':'Preview acceptance'}</button></div>`).join('')}</details>`:''}</section><aside class="pv-side"><section class="pv-section stack"><h2>${unpriced()?'Waiting for a price':'Request total'}</h2><p class="pv-price">${totalText()}</p><p class="hint">${isBundle()?'Separate orders, paid separately.':'No payment is made here.'}</p>${unpriced()?'<button class="btn" onclick="receiveQuote()">Preview delivery quote received</button>':''}<div class="pv-desktop-action">${reviewAction()}</div></section></aside></div>`;}
function sendRequest(){if(unpriced())return;state.sent=true;state.accepted=[];render();}
function accept(key){if(!state.sent||state.accepted.includes(key)||!agreements().some(a=>a.key===key))return;state.accepted.push(key);render();const replies=document.querySelector('.lab-replies');if(replies)replies.open=true;}
function receiveQuote(){state.quote=true;clearReplies();render();}
function render(){
 document.body.classList.toggle('pv-listing',state.view==='listing');$('picksButton').textContent=`Picks (${state.picks.length})`;$('page').innerHTML=state.view==='listing'?listing():reviewView();
 if(state.view==='listing'){
  const save=document.createElement('button');save.className='photo-button save-listing';save.textContent=state.saved?'Saved':'Save';save.setAttribute('aria-label','Save listing');save.setAttribute('aria-pressed',String(state.saved));save.onclick=()=>{state.saved=!state.saved;render();};document.querySelector('.listing-photo').append(save);
 }
 $('dock').innerHTML=state.view==='listing'?`<div><span class="pv-meta">${isBundle()?'Total · paid separately':'Total'}</span><div class="money">${unpriced()?'Quote required':money(knownTotal())}</div></div><button class="btn primary dock-review" onclick="review()">Review</button><button class="dock-picks" aria-label="Add selection to Picks" onclick="addToPicks()">${icon('plus')}</button>`:reviewAction();
}
render();
</script>
</body>
</html>
