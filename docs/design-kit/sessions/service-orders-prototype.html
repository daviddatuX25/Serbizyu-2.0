<style>
.preview-controls{margin-bottom:22px;color:var(--muted-foreground);font-size:13px}.preview-controls>summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.demo-tools{display:flex;gap:14px;align-items:end;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border)}.demo-tools label{display:grid;gap:5px;min-width:170px}.orders-heading{display:flex;justify-content:space-between;gap:18px;align-items:start;margin-bottom:22px}.orders-heading h1{font-size:28px}.orders-heading p{color:var(--muted-foreground);font-size:14px;margin-top:8px}.text-link{border:0;background:none;color:var(--primary);font-weight:700;min-height:44px;padding:8px 0;text-decoration:underline;text-underline-offset:3px}.group-summary{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:10px}.group-summary strong{font-size:27px}.group-summary p{font-size:13px;color:var(--muted-foreground);margin-top:5px}.group-row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;padding:22px 0;border-bottom:1px solid var(--border)}.group-row:last-child{border-bottom:0}.group-row img{width:60px;height:60px;object-fit:cover;border-radius:12px}.group-row h2{font-size:17px!important;margin-bottom:5px}.group-row p{font-size:13px;color:var(--muted-foreground)}.group-row .work-status{display:inline-block;margin-top:8px;font-size:12px;color:var(--primary);font-weight:700}.group-row .group-end{display:grid;gap:8px;text-align:right;justify-items:end}.group-row .money{font-size:19px}.group-row .btn{min-height:44px}.order-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;align-items:start;gap:28px}.order-main{display:grid;gap:20px;min-width:0}.order-states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;background:white}.order-states>div{padding:14px;border-left:1px solid var(--border);min-width:0}.order-states>div:first-child{border-left:0}.order-states span{display:block;color:var(--muted-foreground);font-size:12px;margin-bottom:5px}.order-states strong{font-size:14px;color:var(--primary);overflow-wrap:anywhere}.task-panel{background:white;border:1px solid var(--border);border-radius:16px;padding:24px;display:grid;gap:18px}.task-panel h2{font-size:23px}.task-panel>p{color:var(--muted-foreground);font-size:15px}.task-image{width:100%;height:200px;object-fit:cover;border-radius:12px}.task-tools{display:flex;gap:10px;flex-wrap:wrap}.order-context{background:white;border:1px solid var(--border);border-radius:14px;padding:0 18px}.order-context>summary{font-family:var(--font-display);font-weight:700;font-size:15px;min-height:56px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--primary)}.order-context>summary::after{content:'+';font-family:var(--font-body);font-size:20px}.order-context[open]>summary::after{content:'−'}.context-body{padding:0 0 18px;display:grid;gap:12px;font-size:14px}.context-body p{color:var(--ink-soft);line-height:1.55}.context-body .money{font-size:20px}.order-side{display:grid;gap:14px;min-width:0}.order-side .timeline{font-size:13px}.order-photo{margin:0}.order-photo summary{font-size:13px;color:var(--muted-foreground);min-height:44px;cursor:pointer}.order-photo img{width:100%;height:220px;object-fit:cover;border-radius:12px}.order-actions{display:flex;gap:16px;flex-wrap:wrap}.order-message{font-size:14px;color:var(--done);padding:12px 0}.order-message:empty{display:none}.check-row{display:flex;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}.check-row input{width:20px;height:20px;margin:0;flex-shrink:0}.review-photo{width:100%;max-height:230px;object-fit:cover;border-radius:12px}.readonly-lines{font-size:14px;line-height:1.7}.pv-dialog{width:min(100%,650px)}.order-list-row{padding:20px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:18px}.order-list-row h2{font-size:18px;margin-bottom:7px}.order-list-row p{font-size:14px;color:var(--muted-foreground)}.order-list-row>.money{font-size:22px}.desktop-primary{min-height:48px}.detail-identity{display:flex;align-items:center;gap:10px}.detail-identity .ref{font-size:12px}.pv-dialog .pv-toolbar{border:0;margin:0;padding:0}.sheet-close{width:44px;height:44px;background:white;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;color:var(--primary)}
@media(max-width:799px){.orders-heading{flex-direction:column;gap:10px}.orders-heading h1{font-size:24px}.order-layout{grid-template-columns:minmax(0,1fr);gap:18px}.group-row{grid-template-columns:48px minmax(0,1fr);gap:12px}.group-row img{width:48px;height:48px}.group-row .group-end{grid-column:2;display:flex;align-items:center;justify-content:space-between;width:100%}.group-summary strong{font-size:24px}.order-states>div{padding:12px 9px}.order-states strong{font-size:12px}.task-panel{padding:20px}.task-panel h2{font-size:21px}.desktop-primary{display:none}.demo-tools label{width:100%;min-width:0}.demo-tools select{width:100%}.pv-dock .btn{min-height:48px}.pv-dock .btn::before{display:none}}
.orders-heading .money{display:block;font-size:23px;margin-top:12px}
</style>

<body>
<header class="pv-header"><div class="pv-header-inner"><a class="pv-brand" href="service-journey-prototype.html"><img src="../assets/brand/serbizyu-long-navy-opt.png" alt="Serbizyu"></a><nav class="pv-nav" aria-label="Prototype screens"><a href="service-journey-prototype.html">Service</a><a href="service-orders-prototype.html" aria-current="page">Orders</a><a href="quick-deal-journey-prototype.html">Quick Deal</a></nav></div></header>
<p class="pv-prototype-note">Interactive preview · sample orders · no real transactions</p>
<main class="pv-page">
 <details class="preview-controls"><summary>Preview cases</summary><div class="demo-tools"><label>View<select id="perspective"><option value="buyer">Customer</option><option value="provider">Provider</option></select></label><label>Scenario<select id="scenario"><option value="active">In progress</option><option value="review">Work ready for review</option><option value="waiting">Visit time pending</option><option value="legacy">Older order · read only</option></select></label><label>Order<select id="orderSelect"></select></label><button class="btn" id="reset">Reset</button><a class="text-link" href="service-work-tools-prototype.html">Work tools mock</a></div></details>
 <header class="orders-heading"><div><h1 id="pageTitle">My orders</h1><p id="pageSubtitle"></p><strong class="money" id="orderPrice" hidden></strong></div><div class="order-actions"><button class="text-link" id="back" hidden>Back to orders</button><button class="text-link" id="messages" hidden>Group messages</button></div></header>
 <p id="notice" class="order-message" role="status"></p>
 <section id="listView" hidden></section>
 <section id="groupView" hidden><div class="group-summary"><div><strong class="money" id="groupTotal"></strong><p>3 orders · paid separately</p></div><button class="text-link" data-panel="group">Details</button></div><div id="children"></div></section>
 <section class="order-layout" id="detailView" hidden>
  <div class="order-main">
   <div class="order-states" aria-label="Order states"><div><span>Agreement</span><strong>Accepted</strong></div><div><span>Work</span><strong id="workState"></strong></div><div><span>Payment</span><strong id="paymentState">Unpaid</strong></div></div>
   <section class="task-panel"><h2 id="nextTitle"></h2><p id="nextBody"></p><div id="taskContent"></div><div class="task-tools"><button class="btn" id="evidence" data-panel="evidence">View evidence</button><button class="btn primary desktop-primary" id="primaryDesktop"></button></div></section>
   <div class="order-actions"><button class="text-link" data-panel="message">Message provider</button><button class="text-link" data-panel="help">Get help</button></div>
   <details class="order-photo"><summary>Listing photo</summary><img id="orderPhoto" src="../photos/ac-clean.jpg" alt="Sample listing"></details>
  </div>
  <aside class="order-side">
   <details class="order-context" id="termsContext"><summary>Order details</summary><div class="context-body"><strong id="selectedPackage"></strong><p id="scope"></p><p id="schedule"></p><button class="text-link" data-panel="terms">Full agreement</button></div></details>
   <details class="order-context" id="paymentContext"><summary>Payment</summary><div class="context-body"><strong>Unpaid</strong><p id="recipient"></p><p id="paymentMethod">Cash to the provider.</p><button class="text-link" data-panel="payment">Payment details</button></div></details>
   <details class="order-context" id="activityContext"><summary>Activity</summary><div class="context-body"><ol class="timeline" id="activity"></ol><button class="text-link" data-panel="activity">All activity</button></div></details>
   <button class="text-link" id="showGroup" hidden>View Deal Chain</button>
  </aside>
 </section>
</main>
<footer class="pv-dock" id="dock" hidden><button class="btn primary block" id="primaryMobile"></button></footer>
<dialog class="pv-dialog" id="sheet" aria-labelledby="sheetTitle"><svg class="pv-wave" viewBox="0 0 390 34" preserveAspectRatio="none" aria-hidden="true"><path fill="white" d="M 0 16 C 90 2, 140 0, 195 0 C 255 0, 315 8, 390 28 L 390 34 L 0 34 Z"/></svg><div class="pv-sheet-body"><div class="pv-sheet-head"><h2 id="sheetTitle"></h2><button class="sheet-close" aria-label="Close" id="closeSheet"><svg class="ic" aria-hidden="true"><use href="final-icons.svg#i-x"/></svg></button></div><div id="sheetContent" class="stack"></div></div></dialog>
<script>
(()=>{
 const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
 const money=value=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(value);
 const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const packageData={standard:{title:'1 Unit Standard',price:450,scope:'On-site breaker isolation & diagnostic status check; evaporator coil alkaline chemical foam disinfection; blower fan wheel disassembly and grease flush; dual-probe delta temperature test (ΔT ≥ 12°C).'},duo:{title:'2 Units Dual Split',price:850,scope:'Complete service on two indoor units; outdoor condensing unit pressure flush & fin inspection; Freon operating pressure calibration test; full photographic milestone sign-off.'},home:{title:'3 Units Full Home',price:1200,scope:'Complete service on three indoor units + outdoor units; anti-bacterial ozone air duct sanitization; priority same-day completion guarantee; customer OTP handover & digital service warranty.'}};
 const packageId=Object.hasOwn(packageData,params.get('package'))?params.get('package'):'standard',pkg=packageData[packageId];
 const addonData={rush:{title:'Rush priority scheduling',price:100},flush:{title:'Anti-bacterial chemical flush',price:150}};
 const addonIds=[...new Set((params.get('addons')||'').split(','))].filter(id=>Object.hasOwn(addonData,id));
 const rawQuantity=Number(params.get('quantity')||1),quantity=Number.isSafeInteger(rawQuantity)&&rawQuantity>0&&rawQuantity<=10?rawQuantity:1;
 const bundled=params.get('offer')==='cool-again',extra=addonIds.reduce((sum,id)=>sum+addonData[id].price,0);
 const orders={service:{title:'AC deep clean & checkup',provider:'Kuya Ben Aircon Services',ref:'ORD-DEMO-4501',price:(pkg.price+extra)*quantity,photo:'../photos/ac-clean.jpg',selection:`${pkg.title} × ${quantity}`,scope:pkg.scope+(addonIds.length?' '+addonIds.map(id=>addonData[id].title).join('; ')+'.':''),schedule:'Visit time confirmed with Maria.',kind:'service'},part:{title:'35µF capacitor',provider:'Tagudin Hardware',ref:'ORD-DEMO-1802',price:180*quantity,photo:'../photos/ac-capacitor.jpg',selection:`${quantity} replacement part${quantity===1?'':'s'}`,scope:'Counter handoff of the listed replacement capacitor.',schedule:'Handoff before delivery.',kind:'product'},delivery:{title:'Parts delivery',provider:'Danny Express',ref:'ORD-DEMO-0035',price:35*quantity,photo:'../photos/courier.jpg',selection:`${quantity} delivery request${quantity===1?'':'s'}`,scope:'Tagudin Hardware to Poblacion Este.',schedule:'Delivery before the cleaning visit.',kind:'delivery'}};
 const childIds=bundled?['part','delivery','service']:['service'];
 const legacyOrder={title:'Earlier AC cleaning',provider:'Kuya Ben Aircon Services',ref:'ORD-DEMO-2025',price:450,photo:'../photos/ac-clean.jpg',selection:'1 Unit Standard × 1',scope:'Recorded one-unit cleaning agreement.',schedule:'Earlier recorded visit.',kind:'service'};
 const state={view:params.get('scenario')==='legacy'?'detail':params.get('view')==='group'&&bundled?'group':params.get('view')==='detail'?'detail':'list',order:childIds.includes(params.get('order'))?params.get('order'):'service',perspective:'buyer',scenario:params.get('scenario')==='legacy'?'legacy':'active',workReviewed:false,visitConfirmed:false,evidenceSaved:false,photoName:'',notice:''};
 let primaryAction=null;
 const selected=()=>state.scenario==='legacy'?legacyOrder:orders[state.order];
 const proposedVisit='Today, 3:00 PM';
 function scheduleLabel(d){return d.kind==='service'&&state.scenario==='waiting'?(state.visitConfirmed?proposedVisit+' · confirmed':'Proposed: '+proposedVisit+' · waiting for Maria'):d.schedule;}
 const groupTotal=()=>childIds.reduce((sum,id)=>sum+orders[id].price,0);
 function workStatus(id){if(state.scenario==='legacy')return 'Recorded';if(id==='part')return 'Handed over';if(id==='delivery')return state.scenario==='active'?'In transit':'Delivered';if(state.workReviewed)return 'Reviewed';if(state.scenario==='review')return 'Review due';if(state.scenario==='waiting')return state.visitConfirmed?'Scheduled':'Time pending';return bundled?'Waiting for delivery':'In progress';}
 function setQuery(){const next=new URL(location.href);next.searchParams.set('offer',bundled?'cool-again':'service');next.searchParams.set('view',state.view);next.searchParams.set('package',packageId);next.searchParams.set('quantity',quantity);if(addonIds.length)next.searchParams.set('addons',addonIds.join(','));if(state.scenario==='legacy')next.searchParams.set('scenario','legacy');else next.searchParams.delete('scenario');if(state.view==='detail')next.searchParams.set('order',state.order);else next.searchParams.delete('order');history.replaceState({},'',next);}
 function go(view,order=state.order){state.view=view;state.order=order;state.notice='';if(state.scenario==='legacy')state.workReviewed=false;render();window.scrollTo(0,0);}
 function showSheet(title,content){$('sheetTitle').textContent=title;$('sheetContent').innerHTML=content;if(!$('sheet').open)$('sheet').showModal();}
 function closeSheet(){if($('sheet').open)$('sheet').close();}
 function action(label,callback){primaryAction=callback;for(const id of ['primaryDesktop','primaryMobile']){$(id).textContent=label;$(id).hidden=!callback;} $('dock').hidden=!callback||state.view!=='detail';}
 function render(){
  setQuery();$('perspective').value=state.perspective;$('scenario').value=state.scenario;
  $('orderSelect').innerHTML=childIds.map(id=>`<option value="${id}">${orders[id].title}</option>`).join('');$('orderSelect').value=state.order;
  $('listView').hidden=state.view!=='list';$('groupView').hidden=state.view!=='group';$('detailView').hidden=state.view!=='detail';$('back').hidden=state.view==='list';$('messages').hidden=state.view!=='group';$('notice').textContent=state.notice;
  $('pageTitle').textContent=state.view==='list'?'My orders':state.view==='group'?'Service with parts & delivery':selected().title;
  $('pageSubtitle').textContent=state.view==='group'?`Deal Chain · ${childIds.length} orders`:state.view==='detail'?selected().ref+' · '+selected().provider:'';
  $('back').textContent=state.view==='detail'&&bundled&&state.scenario!=='legacy'?'Back to Deal Chain':'Back to orders';$('orderSelect').disabled=state.scenario==='legacy';
  $('dock').hidden=true;
  $('orderPrice').hidden=state.view!=='detail';
  if(state.view==='list')renderList();else if(state.view==='group')renderGroup();else renderDetail();
 }
 function renderList(){const title=bundled?'Service with parts & delivery':'AC deep clean & checkup';$('listView').innerHTML=`<article class="order-list-row"><div><h2>${title}</h2><p>${bundled?'3 orders':'Kuya Ben Aircon Services'} · ${workStatus('service')}</p><button class="text-link" id="openCurrent">${bundled?'View Deal Chain':'View order'}</button></div><strong class="money">${money(groupTotal())}</strong></article><article class="order-list-row"><div><h2>Earlier AC cleaning</h2><p>Older order · read only</p><button class="text-link" id="openLegacy">View order</button></div><strong class="money">${money(450)}</strong></article>`;$('openCurrent').onclick=()=>go(bundled?'group':'detail','service');$('openLegacy').onclick=()=>{state.scenario='legacy';go('detail','service');};}
 function renderGroup(){$('groupTotal').textContent=money(groupTotal());$('children').innerHTML=childIds.map(id=>{const d=orders[id];return `<article class="group-row"><img src="${d.photo}" alt=""><div><h2>${d.title}</h2><p>${d.provider}</p><span class="work-status">Work: ${workStatus(id)}</span></div><div class="group-end"><strong class="money">${money(d.price)}</strong><button class="btn" data-order="${id}">View order</button></div></article>`;}).join('');}
 function renderDetail(){
  const d=selected(),provider=state.perspective==='provider';
  $('workState').textContent=workStatus(state.order);$('orderPrice').textContent=money(d.price);$('selectedPackage').textContent=d.selection;$('scope').textContent=d.scope;$('schedule').textContent=scheduleLabel(d);$('recipient').textContent='Pay '+d.provider+' directly.';$('orderPhoto').src=d.photo;$('showGroup').hidden=!bundled||state.scenario==='legacy';
  $('activity').innerHTML='<li>Agreement accepted<small>Maria and '+d.provider+'</small></li><li>'+workStatus(state.order)+'<small>Work record</small></li>'+(state.workReviewed&&d.kind==='service'&&state.scenario!=='legacy'?'<li class="done">Customer reviewed work</li>':'');
  $('evidence').hidden=d.kind!=='service'||state.scenario==='legacy'||!(state.scenario==='review'||state.workReviewed||state.evidenceSaved);$('taskContent').innerHTML='';
  if(state.scenario==='legacy'){$('nextTitle').textContent='Older order';$('nextBody').textContent='Details are available. Work tracking is read only.';action('',null);}
  else if(d.kind==='product'){$('nextTitle').textContent='Part handed over';$('nextBody').textContent='The courier collected the capacitor.';action('Handoff details',()=>panel('handoff'));}
  else if(d.kind==='delivery'){$('nextTitle').textContent=workStatus('delivery')==='In transit'?'Delivery in progress':'Part delivered';$('nextBody').textContent='Danny Express · Tagudin Hardware to Poblacion Este.';action('Delivery details',()=>panel('handoff'));}
  else if(state.workReviewed){$('nextTitle').textContent='Work reviewed';$('nextBody').textContent='Payment is still recorded separately.';action('',null);}
  else if(state.scenario==='waiting'){if(state.visitConfirmed){$('nextTitle').textContent='Visit time confirmed';$('nextBody').textContent=proposedVisit;action('',null);}else{$('nextTitle').textContent=provider?'Waiting for Maria':'Confirm the visit time';$('nextBody').textContent='Proposed visit: '+proposedVisit;action(provider?'':'Confirm visit time',provider?null:confirmVisitTime);}}
  else if(state.scenario==='review'){$('nextTitle').textContent=provider?'Waiting for Maria’s review':'Check the completed work';$('nextBody').textContent=provider?'Maria reviews the photos and checklist.':'Review the photos and checklist before confirming.';action(provider?'':'Review work',provider?null:reviewWork);}
  else if(bundled){$('nextTitle').textContent='Delivery comes first';$('nextBody').textContent='The service starts after the part arrives.';action('',null);}
  else{$('nextTitle').textContent=provider?'Add work evidence':'Service in progress';$('nextBody').textContent=provider?'Photos and checklist for this service.':'Kuya Ben is working on the service.';action(provider?'Add evidence':'',provider?providerEvidence:null);}
  for(const details of document.querySelectorAll('.order-context'))details.open=window.innerWidth>=800;
 }
 function panel(key){
  const d=selected();
  if(key==='group'){showSheet('Service with parts & delivery',`<p class="hint">Saved offer: Cool Again</p><p>${pkg.title} × ${quantity}${addonIds.length?' · '+addonIds.map(id=>addonData[id].title).join(', '):''}</p><p>Part handoff → delivery → service.</p><p>Each provider has their own agreement and payment.</p>`);return;}
  if(key==='terms'){showSheet('Order agreement',`<div class="readonly-lines"><strong>${d.title}</strong><p>${d.provider}</p><p>${d.selection}</p><p>${d.scope}</p><p>${scheduleLabel(d)}</p><p class="money">${money(d.price)}</p></div>`);return;}
  if(key==='payment'){showSheet('Payment',`<strong>Unpaid</strong><p class="money">${money(d.price)}</p><p>Cash to ${d.provider}.</p><p class="hint">No payment action is performed in this preview.</p>`);return;}
  if(key==='activity'){showSheet('Order activity',`<ol class="timeline">${$('activity').innerHTML}</ol>`);return;}
  if(key==='message'){showSheet('Message '+d.provider,`<p>Conversation for ${d.ref}.</p><p class="hint">Sample conversation only. Nothing is sent.</p>`);return;}
  if(key==='groupMessage'){showSheet('Group messages','<p>Maria, Kuya Ben, Tagudin Hardware and Danny Express.</p><p class="hint">Sample group conversation. No real messages are sent.</p>');return;}
  if(key==='help'){showSheet('Help with this order',`<p>${d.title} · ${d.ref}</p><p class="hint">No support case is created by this preview.</p>`);return;}
  if(key==='handoff'){showSheet(d.kind==='delivery'?'Delivery handoff':'Part handoff',`<p>${d.selection}</p><p>${d.scope}</p><p><strong>Work:</strong> ${workStatus(state.order)}</p><p><strong>Payment:</strong> Unpaid</p><p class="hint">Real handoff proof and recipient confirmation use the existing Order tools; this view only illustrates their recorded facts.</p>`);return;}
  if(key==='evidence'){showSheet('Work evidence',`<img class="review-photo" src="../photos/ac-clean.jpg" alt="Sample work photo"><p>Indoor unit cleaned · cooling checked.</p><p class="hint">Sample evidence for the preview.</p>`);}
 }
 function confirmVisitTime(){
  if(selected().kind!=='service'||state.scenario!=='waiting'||state.perspective!=='buyer'||state.visitConfirmed)return;
  showSheet('Confirm visit time',`<strong>${proposedVisit}</strong><p>Kuya Ben Aircon Services · ${pkg.title}</p><button class="btn primary" id="acceptVisit">Confirm this time</button><button class="text-link" id="keepPending">Not now</button><p class="hint">Confirms the visit time only. Work and payment are unchanged.</p>`);
  $('keepPending').onclick=closeSheet;
  $('acceptVisit').onclick=()=>{if(state.scenario!=='waiting'||state.perspective!=='buyer'||state.visitConfirmed)return;state.visitConfirmed=true;state.notice='Visit time confirmed.';closeSheet();render();};
 }
 function reviewWork(){if(selected().kind!=='service'||state.scenario!=='review'||state.perspective!=='buyer'||state.scenario==='legacy')return;showSheet('Review the work','<img class="review-photo" src="../photos/ac-clean.jpg" alt="Sample cleaning evidence"><p>Indoor unit cleaned. Cooling function checked.</p><label class="check-row"><input type="checkbox" id="reviewCheck"><span>I checked the completed work.</span></label><button class="btn primary" id="confirmReview" disabled>Confirm work review</button><p class="hint">Confirms Work only, not payment.</p>');$('reviewCheck').onchange=()=>{$('confirmReview').disabled=!$('reviewCheck').checked;};$('confirmReview').onclick=()=>{if(!$('reviewCheck').checked)return;state.workReviewed=true;closeSheet();state.notice='Work reviewed. Payment unchanged.';render();};}
 function providerEvidence(){if(selected().kind!=='service'||state.perspective!=='provider'||state.scenario!=='active'||bundled)return;showSheet('Work evidence',`<label>Photo<input id="photoInput" type="file" accept="image/*"></label><p class="hint" id="photoName">${state.photoName?escapeHTML(state.photoName):'Choose a local sample photo.'}</p><label class="check-row"><input id="cleanCheck" type="checkbox"><span>Indoor unit cleaned</span></label><label class="check-row"><input id="coolCheck" type="checkbox"><span>Cooling function checked</span></label><button class="btn primary" id="saveEvidence" disabled>Save preview evidence</button>`);const ready=()=>{$('saveEvidence').disabled=!(state.photoName&&$('cleanCheck').checked&&$('coolCheck').checked);};$('photoInput').onchange=e=>{const f=e.target.files[0];if(f){state.photoName=f.name;$('photoName').textContent=f.name+' · local only';}ready();};$('cleanCheck').onchange=ready;$('coolCheck').onchange=ready;$('saveEvidence').onclick=()=>{if($('saveEvidence').disabled)return;state.evidenceSaved=true;state.notice='Evidence kept in this preview.';closeSheet();render();};}
 document.addEventListener('click',e=>{const child=e.target.closest('[data-order]');if(child){go('detail',child.dataset.order);return;}const trigger=e.target.closest('[data-panel]');if(trigger)panel(trigger.dataset.panel);});
 $('back').onclick=()=>{if(state.scenario==='legacy'){state.scenario='active';go('list');}else go(state.view==='detail'&&bundled?'group':'list');};$('messages').onclick=()=>panel('groupMessage');$('showGroup').onclick=()=>go('group');$('primaryDesktop').onclick=$('primaryMobile').onclick=()=>{if(primaryAction)primaryAction();};$('closeSheet').onclick=closeSheet;$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet();};
 $('perspective').onchange=e=>{state.perspective=e.target.value;render();};$('scenario').onchange=e=>{state.scenario=e.target.value;state.workReviewed=false;state.visitConfirmed=false;if(state.scenario==='legacy'){state.view='detail';state.order='service';}render();};$('orderSelect').onchange=e=>go('detail',e.target.value);$('reset').onclick=()=>{Object.assign(state,{view:'list',order:'service',scenario:'active',perspective:'buyer',workReviewed:false,visitConfirmed:false,evidenceSaved:false,photoName:'',notice:''});render();};
 matchMedia('(min-width:800px)').addEventListener('change',()=>{for(const details of document.querySelectorAll('.order-context'))details.open=window.innerWidth>=800;});
 render();
})();
</script>
</body>
